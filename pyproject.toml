[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-project-manager"
version = "0.9.0"
description = "Claude Project Manager (CPM): local-first manager for parallel Claude API workers"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "keyring>=25",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pyyaml>=6",
  "websockets>=13",  # uvicorn needs a WebSocket library for the live run stream (WP15)
]

[project.optional-dependencies]
sdk = ["claude-agent-sdk==0.2.170"]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10", "pip-audit>=2.7", "types-PyYAML"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cpm = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["windows: needs a Windows PC (Job Objects, PowerShell, DPAPI)"]

[tool.ruff]
extend-exclude = ["migrations/versions"]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
strict = true
files = ["src"]
exclude = ["migrations"]

[[tool.mypy.overrides]]
module = ["claude_agent_sdk", "claude_agent_sdk.*"]
ignore_missing_imports = true
