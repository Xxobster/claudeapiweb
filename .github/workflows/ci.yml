name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r requirements.lock
      - run: pip install --no-deps -e .
      - run: ruff check .
      - run: mypy --strict src
      - run: pytest -m "not windows"
      - run: pip-audit -r requirements.lock --no-deps --disable-pip
      - name: Lockfile is up to date
        run: |
          pip install uv
          uv pip compile pyproject.toml --extra dev --universal --python-version 3.12 \
            --generate-hashes -o /tmp/check.lock
          diff <(grep -v '^#' requirements.lock) <(grep -v '^#' /tmp/check.lock)
        shell: bash
