# Nirandyr profile (PLAN.md section 5). Extended in WP6 (locks), WP12 (lanes) and WP13 (voice lane).
id: nirandyr
path: 'D:\projects\game'          # read-only for CPM; main tree edited only by Desktop
remote: https://github.com/Xxobster/Nirandyr
worktree_root: 'D:\projects\cpm-worktrees\nirandyr'
integration: pr_only               # rules 37-40; never push main; Compilation merges
protected_branches: [main]
branch_pattern: "claude/{role}-{task_slug}"
instruction_sources:
  - docs/plans/00_DECISIONS_MICAH.md
  - docs/plans/99_IMPACT_MAP.md
task_sources:
  - docs/JOB_BOARD.md
  - docs/COORDINATOR_INBOX.md
external_locks:
  job_board: docs/JOB_BOARD.md      # read-only in v1
  devlock: tools/devices/devlock.py
  gpu_lock: tools/gpu_lock.sh
# Rule 26: while any of these exists, no heavy PC work starts (Unity batch, Blender, GPU, devices).
lock_files:
  build_running: 'D:\projects\game-build\BUILD_RUNNING.lock'
  # Location NOT verified on the PC yet (WP6 open item): assumed next to BUILD_RUNNING.lock.
  blender_running: 'D:\projects\game-build\BLENDER_RUNNING.lock'
lock_dirs:
  # tools/gpu_lock.sh writes <tool>-<pid>.lock here (voice and art GPU jobs use it, rules 26/49).
  gpu_locks: 'D:\projects\gpu-locks'
heavy_resources: [unity_editor, gpu, blender, device]
default_effort: medium
pr_body_must_list: [files_changed, security_findings, exploit_findings, what_needs_pc]

# Lanes (WP12 framework). Commands are reviewed in-repo scripts with fixed arguments only.
lanes:
  voice:
    title: Voice lines
    description: >-
      Render the fixed voice lines with the local Kokoro/Piper pipeline (tools/voice/render_fixed.py)
      and check the result. Free local tools only (Nirandyr rule 36); lowest GPU priority (rule 49).
    queue_bias: 500          # tasks default to priority 100; builds and art run first, voice last
    resources:
      - type: gpu            # heavy: one at a time, waits for BUILD_RUNNING.lock and gpu-locks
    # The pipeline's own venv lives in the MAIN tree (untracked); CPM only checks that it exists.
    required_tools:
      voice_python: 'D:\projects\game\tools\voice\.venv\Scripts\python.exe'
    task_template:
      title_prefix: '[voice] '
      description: >-
        Render every missing or stale voice line, then run the check mode and fix what it reports.
      default_acceptance:
        - render_fixed.py --check exits 0 (no missing or stale line)
        - every line of the voice index has an output file
    prompt: |
      You are the voice lane worker. Work only in this worktree.
      Allowed commands (exact, nothing else):
      {commands}
      Steps: run the check first and read what is missing or stale; render; run the check again
      until it passes. Rendering resumes: lines that are already valid are skipped, so after an
      interruption just run it again. Outputs go only under: {asset_paths}.
      Never edit the voice pipeline, the line scripts or any other source file in this task.
      Finish with a report that has these sections: {report_sections}.
    commands:
      # --check first: the plain rule below would refuse the extra flag.
      - name: voice-check
        program: python
        prefix: [tools/voice/render_fixed.py, --check]
        needs_trust: true        # runs repository code (R-WP12-4): trusted workspace only
        description: report missing or stale lines (exit 1 = work left)
      - name: voice-render
        program: python
        prefix: [tools/voice/render_fixed.py]
        needs_trust: true
        description: render every missing or stale line
    artifacts:
      asset_paths: [Assets/StreamingAssets/Voice/]
      extensions: [.rva, .json, .wav]
      binary_extensions: [.rva, .wav]
      max_file_bytes: 5000000
      binary_policy: ask       # Nirandyr rules on binaries: Micah decides, CPM never adds LFS rules
    validators:
      - kind: files_exist
        params: {glob: 'Assets/StreamingAssets/Voice/lines/*.rva', min_count: 1}
      # Completeness against the pipeline's own index (ids -> files). The index shape is
      # UNVERIFIED on the PC; an unknown shape makes the gate wait for a person, never pass.
      - kind: voice_line_list
        params:
          index: Assets/StreamingAssets/Voice/index.json
          lines_dir: Assets/StreamingAssets/Voice/lines
          ext: .rva
          extra: warn
      # Only for WAV outputs (Piper fallback or previews); .rva files are not parsed by CPM.
      - kind: audio_format
        params: {glob: 'Assets/StreamingAssets/Voice/*.wav', min_duration_s: 0.2, max_duration_s: 60}
      - kind: audio_loudness
        params: {glob: 'Assets/StreamingAssets/Voice/*.wav', max_peak_dbfs: -0.5, min_rms_dbfs: -40, max_rms_dbfs: -8}
      - kind: audio_silence
        params: {glob: 'Assets/StreamingAssets/Voice/*.wav'}
    report:
      required_sections: [Summary, Checks, Left to do]
    limits:
      max_runtime_s: 14400     # long generations are allowed (rule 27); hang detection stays
      hang_timeout_s: 900
